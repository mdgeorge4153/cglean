name: Blueprint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # elan reads lean-toolchain, so the version lives in one place.
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib build cache
        run: lake exe cache get

      - name: Build
        run: lake build

      # plasTeX renders the text itself; TeX is only needed for the TikZ
      # pictures, which it compiles with latex and converts with dvisvgm (see
      # web.tex). A few texlive packages rather than texlive-full. Graphviz is
      # for the dependency graph.
      # A venv rather than pipx: leanblueprint shells out to `plastex`, which
      # pipx would not put on PATH since it is a dependency's entry point.
      - name: Install blueprint tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz libgraphviz-dev \
            texlive-latex-base texlive-latex-recommended texlive-pictures \
            dvisvgm ghostscript
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install leanblueprint
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build blueprint
        run: leanblueprint web

      - name: Check the blueprint against the library
        run: python3 scripts/check-blueprint.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: blueprint/web

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
