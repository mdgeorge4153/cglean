name: Blueprint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A new push to a PR cancels that PR's run still in progress, which would only
# check a commit nobody looks at any more. Pushes to main queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three jobs: `lean` (the library, the demo, the API docs, and the blueprint
# check) and `blueprint` (which needs no Lean) run in parallel; on main, `site`
# then puts their output together and `deploy` publishes it. The demo stays in
# `lean`, rather than a job of its own, so that Mathlib's cache is fetched once.
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # elan reads lean-toolchain, so the version lives in one place.
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib build cache
        run: lake exe cache get

      # Any warning fails the build, except `declaration uses sorry`: those are
      # placeholders while sketching, and the blueprint check below reports
      # which of the blueprint's declarations still depend on them. Warnings
      # from LeanCert's own files are not ours to fix: it predates the module
      # system (alerad/leancert#131), so Lake warns about each of its Mathlib
      # imports.
      - name: Build
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
          if grep '^warning:' build.log | grep -v 'declaration uses `sorry`' \
              | grep -v '^warning: LeanCert/'; then
            echo "::error::lake build produced warnings other than sorry (listed above)"
            exit 1
          fi

      # It reads the blueprint's source, not the built blueprint.
      - name: Check the blueprint against the library
        run: python3 scripts/check-blueprint.py

      # The drag-and-drop demo, compiled to WebAssembly (web/README.md) and
      # embedded in the blueprint's Applications chapter. Built on every PR, so
      # that a change breaking it doesn't merge. The cache holds what build.sh
      # makes once per Lean version: Lean's runtime, libuv, and the C for Init
      # and Std, plus Emscripten's own system libraries.
      # Installed at a fixed path, and cached: by default each run installs it
      # in a new temporary directory, whose path ends up in everything ccache
      # hashes (clang's --version, the paths of its own headers), so nothing
      # would ever match.
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.10
          actions-cache-folder: .emsdk

      - name: Cache the WebAssembly runtime
        uses: actions/cache@v6
        with:
          path: |
            .lake/wasm-v*/lean4-src
            .lake/wasm-v*/libuv
            .lake/wasm-v*/lib
            .lake/wasm-v*/core-c
            .lake/emcache
          key: Wasm1-${{ hashFiles('lean-toolchain') }}-emsdk-6.0.10

      # Most of the demo's build is compiling the same few thousand C files
      # (Mathlib's, Init's, ...) with emcc, so ccache keeps the objects. Only
      # main saves the cache; PRs restore main's, rather than each storing
      # another copy.
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: demo-emsdk-6.0.10
          save: true   # TEMPORARY: to measure ccache on this PR

      # build.sh uses ccache when it's installed; the action configures its
      # cache directory.
      - name: Build the demo
        run: web/build.sh
        env:   # TEMPORARY: to see why ccache misses
          CCACHE_DEBUG: 'true'
          CCACHE_DEBUGDIR: ${{ github.workspace }}/_ccache-debug

      - uses: actions/upload-artifact@v7   # TEMPORARY
        with:
          name: ccache-debug-${{ github.run_attempt }}
          path: _ccache-debug/**/*Mathlib_Init.o.*
          retention-days: 1

      # doc-gen4 records every declaration it sees in a SQLite database and
      # only then renders HTML from it. DOCGEN_LOCAL_MODULE_ROOTS restricts that
      # to CGLean's own modules (leanprover/doc-gen4#396): Mathlib and the Lean
      # core are neither ingested nor rendered, and links into them point at
      # Mathlib's hosted documentation.
      #
      # The build directory is cached anyway, along with doc-gen4 and the
      # packages only it uses: every entry in the database records the hash of
      # the doc-gen4 executable among its inputs, and that executable does not
      # come out byte-identical from one build to the next, so it has to be
      # restored rather than rebuilt for any cached entry to be reused.
      - name: Cache the generated documentation
        uses: actions/cache@v6
        with:
          path: |
            docbuild/.lake
            .lake/packages/doc-gen4
            .lake/packages/leansqlite
            .lake/packages/MD4Lean
            .lake/packages/BibtexQuery
            .lake/packages/UnicodeBasic
          key: DocData2-${{ hashFiles('lake-manifest.json', 'docbuild/lake-manifest.json') }}
          restore-keys: |
            DocData2-

      - name: Build documentation
        run: lake build CGLean:docs
        working-directory: docbuild
        env:
          DOCGEN_LOCAL_MODULE_ROOTS: CGLean
          DOCGEN_DEPS_DOCS_URL: https://leanprover-community.github.io/mathlib4_docs

      # The API documentation goes under `docs/`, which is where the blueprint's
      # `\dochome` points its statement links, and the demo under `demo/`,
      # where the blueprint embeds it.
      - name: Collect the demo and the documentation
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p _part/demo
          cp -r docbuild/.lake/build/doc _part/docs
          cp -r web/index.html web/main.js web/dist _part/demo/

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site-lean
          path: _part
          retention-days: 1

  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # plasTeX renders the text itself; TeX is only needed for the TikZ
      # pictures, which it compiles with latex and converts with dvisvgm (see
      # web.tex). A few texlive packages rather than texlive-full. Graphviz is
      # for the dependency graph.
      # A venv rather than pipx: leanblueprint shells out to `plastex`, which
      # pipx would not put on PATH since it is a dependency's entry point.
      - name: Install blueprint tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz libgraphviz-dev \
            texlive-latex-base texlive-latex-recommended texlive-pictures \
            dvisvgm ghostscript
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install leanblueprint
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build blueprint
        run: leanblueprint web

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site-blueprint
          path: blueprint/web
          retention-days: 1

  # The blueprint at the root, with the demo and the documentation beside it.
  site:
    needs: [lean, blueprint]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: _site
          merge-multiple: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Let a running deployment finish rather than cancelling it part-way.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
