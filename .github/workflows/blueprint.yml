name: Blueprint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # elan reads lean-toolchain, so the version lives in one place.
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib build cache
        run: lake exe cache get

      - name: Build
        run: lake build

      # doc-gen4 records every declaration it sees in a SQLite database and
      # only then renders HTML from it. Filling the database for Mathlib and
      # the Lean core takes far longer than rendering, so the database and the
      # per-module marker files that tell Lake it is current are cached. The
      # markers for CGLean itself are excluded, which forces its own entries to
      # be regenerated while everything else is replayed.
      - name: Cache the documentation database
        uses: actions/cache@v4
        with:
          path: |
            docbuild/.lake/build/api-docs.db
            docbuild/.lake/build/doc-data
            !docbuild/.lake/build/doc-data/CGLean*
          key: DocData-${{ hashFiles('lake-manifest.json', 'docbuild/lake-manifest.json') }}
          restore-keys: |
            DocData-

      - name: Build documentation
        run: lake build CGLean:docs
        working-directory: docbuild

      # No TeX: the blueprint contains no TikZ or included graphics, so plasTeX
      # renders it unaided. Graphviz is for the dependency graph.
      # A venv rather than pipx: leanblueprint shells out to `plastex`, which
      # pipx would not put on PATH since it is a dependency's entry point.
      - name: Install blueprint tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install leanblueprint
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build blueprint
        run: leanblueprint web

      - name: Check the blueprint against the library
        run: python3 scripts/check-blueprint.py

      # The blueprint sits at the root and the API documentation under `docs/`,
      # which is where the blueprint's `\dochome` points its statement links.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r blueprint/web/. _site/
          cp -r docbuild/.lake/build/doc _site/docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
