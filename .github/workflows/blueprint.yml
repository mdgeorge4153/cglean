name: Blueprint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # elan reads lean-toolchain, so the version lives in one place.
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib build cache
        run: lake exe cache get

      - name: Build
        run: lake build

      # doc-gen4 records every declaration it sees in a SQLite database and
      # only then renders HTML from it. Ingesting Mathlib and the Lean core
      # takes over half an hour, so the whole build directory is cached and
      # Lake replays whatever the current sources still agree with, leaving
      # only CGLean's own modules to re-ingest.
      #
      # doc-gen4 and the packages only it uses are cached alongside, because
      # every entry in the database records the hash of the doc-gen4 executable
      # among its inputs and that executable does not come out byte-identical
      # from one build to the next. Rebuilding it invalidates everything, so it
      # has to be restored rather than rebuilt for any of the rest to be reused.
      - name: Cache the generated documentation
        uses: actions/cache@v4
        with:
          path: |
            docbuild/.lake
            .lake/packages/doc-gen4
            .lake/packages/leansqlite
            .lake/packages/MD4Lean
            .lake/packages/BibtexQuery
            .lake/packages/UnicodeBasic
          key: DocData-${{ hashFiles('lake-manifest.json', 'docbuild/lake-manifest.json') }}
          restore-keys: |
            DocData-

      - name: Build documentation
        run: lake build CGLean:docs
        working-directory: docbuild

      # No TeX: the blueprint contains no TikZ or included graphics, so plasTeX
      # renders it unaided. Graphviz is for the dependency graph.
      # A venv rather than pipx: leanblueprint shells out to `plastex`, which
      # pipx would not put on PATH since it is a dependency's entry point.
      - name: Install blueprint tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install leanblueprint
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build blueprint
        run: leanblueprint web

      - name: Check the blueprint against the library
        run: python3 scripts/check-blueprint.py

      # The blueprint sits at the root and the API documentation under `docs/`,
      # which is where the blueprint's `\dochome` points its statement links.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r blueprint/web/. _site/
          cp -r docbuild/.lake/build/doc _site/docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
