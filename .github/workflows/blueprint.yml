name: Blueprint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # elan reads lean-toolchain, so the version lives in one place.
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib build cache
        run: lake exe cache get

      # Any warning fails the build, except `declaration uses sorry`: those are
      # placeholders while sketching, and the blueprint check below reports
      # which of the blueprint's declarations still depend on them. Warnings
      # from LeanCert's own files are not ours to fix: it predates the module
      # system (alerad/leancert#131), so Lake warns about each of its Mathlib
      # imports.
      - name: Build
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
          if grep '^warning:' build.log | grep -v 'declaration uses `sorry`' \
              | grep -v '^warning: LeanCert/'; then
            echo "::error::lake build produced warnings other than sorry (listed above)"
            exit 1
          fi

      # doc-gen4 records every declaration it sees in a SQLite database and
      # only then renders HTML from it. DOCGEN_LOCAL_MODULE_ROOTS restricts that
      # to CGLean's own modules (leanprover/doc-gen4#396): Mathlib and the Lean
      # core are neither ingested nor rendered, and links into them point at
      # Mathlib's hosted documentation.
      #
      # The build directory is cached anyway, along with doc-gen4 and the
      # packages only it uses: every entry in the database records the hash of
      # the doc-gen4 executable among its inputs, and that executable does not
      # come out byte-identical from one build to the next, so it has to be
      # restored rather than rebuilt for any cached entry to be reused.
      - name: Cache the generated documentation
        uses: actions/cache@v6
        with:
          path: |
            docbuild/.lake
            .lake/packages/doc-gen4
            .lake/packages/leansqlite
            .lake/packages/MD4Lean
            .lake/packages/BibtexQuery
            .lake/packages/UnicodeBasic
          key: DocData2-${{ hashFiles('lake-manifest.json', 'docbuild/lake-manifest.json') }}
          restore-keys: |
            DocData2-

      - name: Build documentation
        run: lake build CGLean:docs
        working-directory: docbuild
        env:
          DOCGEN_LOCAL_MODULE_ROOTS: CGLean
          DOCGEN_DEPS_DOCS_URL: https://leanprover-community.github.io/mathlib4_docs

      # plasTeX renders the text itself; TeX is only needed for the TikZ
      # pictures, which it compiles with latex and converts with dvisvgm (see
      # web.tex). A few texlive packages rather than texlive-full. Graphviz is
      # for the dependency graph.
      # A venv rather than pipx: leanblueprint shells out to `plastex`, which
      # pipx would not put on PATH since it is a dependency's entry point.
      - name: Install blueprint tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz libgraphviz-dev \
            texlive-latex-base texlive-latex-recommended texlive-pictures \
            dvisvgm ghostscript
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install leanblueprint
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build blueprint
        run: leanblueprint web

      - name: Check the blueprint against the library
        run: python3 scripts/check-blueprint.py

      # The blueprint sits at the root and the API documentation under `docs/`,
      # which is where the blueprint's `\dochome` points its statement links.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r blueprint/web/. _site/
          cp -r docbuild/.lake/build/doc _site/docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
