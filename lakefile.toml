name = "cglean"
defaultTargets = ["CGLean"]

# Matches Mathlib. Without it an unknown identifier is silently bound as an
# implicit variable of unknown type, turning "this name no longer exists" into
# a confusing downstream type error.
[leanOptions]
autoImplicit = false

# A Reservoir git dependency: `scope` + `rev` resolves the URL through the
# registry but pins an exact tag. (The `version` field is for Reservoir semver
# releases instead, and would reject a leading "v".) The tag must agree with
# lean-toolchain -- Mathlib only supports the toolchain it was built against.
#
# ProofWidgets, Batteries and Aesop arrive transitively via Mathlib, so
# requiring them here would only risk pinning them inconsistently.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[lean_lib]]
name = "CGLean"
