name = "cglean"
defaultTargets = ["CGLean"]

# An unknown identifier is otherwise silently bound as an implicit variable of
# unknown type, reporting a confusing downstream type error instead.
[leanOptions]
autoImplicit = false

# `rev` must agree with lean-toolchain: Mathlib only supports the toolchain it
# was built against.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

# Dyadic interval arithmetic with containment proofs. Pins the same Mathlib
# revision as above; `LeanCert.Core.IntervalDyadic` does not reach the modules
# carrying that library's sanctioned `sorry`s.
[[require]]
name = "LeanCert"
scope = "alerad"
rev = "main"

[[lean_lib]]
name = "CGLean"
